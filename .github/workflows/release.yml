name: Build & Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Persistent Signing Keystore
        working-directory: android-module/app
        env:
          RELEASE_KEYSTORE_SECRET: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASS_SECRET: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASS_SECRET: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_SECRET" ]; then
            echo "Applying persistent signing keystore from repository secrets..."
            echo "$RELEASE_KEYSTORE_SECRET" | base64 -d > release.jks
          elif [ -f release.p12 ]; then
            echo "Using tracked repository persistent release.p12 keystore..."
          elif [ -f release.jks ]; then
            echo "Using tracked repository release.jks..."
          else
            echo "Generating persistent release.jks keystore..."
            keytool -genkeypair -v \
              -keystore release.jks \
              -storetype JKS \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=BardQuotaHook, OU=Release, O=Gemini-Eye, L=Mountain View, ST=California, C=US"
          fi
          echo "Active signing keystore verified:"
          ls -la release.*
          # Print the cryptographic signature certificate fingerprints for transparency
          if [ -f release.jks ]; then
            keytool -list -v -keystore release.jks -storepass "${KEYSTORE_PASS_SECRET:-android}" -alias "${KEY_ALIAS_SECRET:-release}" | grep -E "Owner:|SHA256:|SHA1:" || true
          elif [ -f release.p12 ]; then
            keytool -list -v -keystore release.p12 -storetype PKCS12 -storepass "${KEYSTORE_PASS_SECRET:-android}" -alias "${KEY_ALIAS_SECRET:-release}" | grep -E "Owner:|SHA256:|SHA1:" || true
          fi

      - name: Build Signed Single-DEX Release APK
        working-directory: android-module
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS || 'release' }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD || 'android' }}
        run: |
          gradle :app:assembleRelease --no-daemon --info --stacktrace
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" ../Gemini-Eye.apk
            echo "Successfully staged $APK_PATH as ../Gemini-Eye.apk"
          else
            echo "Error: No release APK found"
            exit 1
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: Gemini-Eye v2.1.${{ github.run_number }}
          body: "**v2.1.0 Zero-Background Lifecycle & Dynamic Session/Cookie Interception**: Dynamically intercepts active `Authorization`, `Cookie`, and `X-Goog-AuthUser` headers on outgoing Cronet, gRPC `Metadata`, and OkHttp requests for seamless Google account switching (zero static/hardcoded tokens); eliminated all background services, manifest wake-up receivers, and persistent system overlays (`0` permissions requested); `QuotaHudView` attaches strictly when Gemini is in the foreground, sleeps completely (`0` threads) when backgrounded, and triggers lightweight quota refreshes only on app open or user query dispatch."
          files: Gemini-Eye.apk
