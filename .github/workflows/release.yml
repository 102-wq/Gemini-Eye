name: Build & Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Write Persistent Signing Keystore
        working-directory: android-module/app
        run: |
          echo "" | base64 -d > signing.p12

      - name: Build Signed Single-DEX Release APK
        working-directory: android-module
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Gemini-Eye.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.${{ github.run_number }}
          name: Gemini-Eye v1.5.${{ github.run_number }}
          body: "**v1.5 Multi-Process & Android 11+ Visibility Update**: Fixed Android 11+ `<queries>` package visibility false-positive in HUD launcher, added cross-process `BroadcastReceiver` IPC for `:interactor`/`:search` background processes, and added R8-immune ART `StringFactory` + Compose `BoringLayout` + Cronet `ByteBuffer` quota extractors."
          files: Gemini-Eye.apk
