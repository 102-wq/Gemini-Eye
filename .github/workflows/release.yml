name: Build & Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Persistent Signing Keystore
        working-directory: android-module/app
        run: |
          if [ ! -f signing.p12 ]; then
            echo "Generating new PKCS12 signing keystore..."
            keytool -genkeypair -v \
              -keystore signing.p12 \
              -storetype PKCS12 \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=GeminiEye, OU=Release, O=BardQuotaHook, L=Mountain View, ST=California, C=US"
          else
            echo "Using existing signing.p12 keystore"
          fi
          ls -la signing.p12

      - name: Build Signed Single-DEX Release APK
        working-directory: android-module
        run: |
          gradle :app:assembleRelease --no-daemon --info --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../Gemini-Eye.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: Gemini-Eye v2.1.${{ github.run_number }}
          body: "**v2.1.0 Zero-Background Lifecycle & Dynamic Session/Cookie Interception**: Dynamically intercepts active `Authorization`, `Cookie`, and `X-Goog-AuthUser` headers on outgoing Cronet, gRPC `Metadata`, and OkHttp requests for seamless Google account switching (zero static/hardcoded tokens); eliminated all background services, manifest wake-up receivers, and persistent system overlays (`0` permissions requested); `QuotaHudView` attaches strictly when Gemini is in the foreground, sleeps completely (`0` threads) when backgrounded, and triggers lightweight quota refreshes only on app open or user query dispatch."
          files: Gemini-Eye.apk
